<?xml version="1.0" encoding="UTF-8"?>
<!--
  HabitForge Docs — favicon.

  🔴 This is the APP's own mark, not a second one. It is `public/icon.svg` from
  the habitforge repo, scaled from its 512 canvas to 32 (÷16), keeping the
  ledger lockup: the struck ember tick, then three ruled entries shortening
  down the page.

  It replaced a FLAME in a #F97316 -> #DC2626 gradient on 2026-09-01. That was
  wrong twice over: the product's motif is a rope and its icon is a ledger, and
  the gradient came from a Radix theme the app no longer uses. The docs OG card
  had already been rebuilt onto this mark for the same reason, which left the
  favicon as the last flame on the site.

  Colours are the resolved token values, not new ones:
    #120c0a  iron-950
    #ef4f35  ember-500, the claimed hue (32)
    #ebe3e1  iron-200, at 0.55 opacity, the rules

  Square corners and square caps: the design language's shape lock is square.
  Edit this file and re-export; never hand-edit a raster (§6).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"
     role="img" aria-label="HabitForge">
  <rect width="32" height="32" fill="#120c0a" />

  <!-- The tick, at the same 3.5% of the canvas as the app icon. -->
  <rect x="7" y="7" width="3" height="18" fill="#ef4f35" />

  <!-- Three ruled entries, shortening — a day-book page, not a bar chart. -->
  <g stroke="#ebe3e1" stroke-opacity="0.55" stroke-width="1.375" stroke-linecap="square">
    <path d="M12.75 9.5H25" />
    <path d="M12.75 16H23.25" />
    <path d="M12.75 22.5H20" />
  </g>
</svg>
